[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "modern-data-engineering-ai"
version = "0.1.0"
description = "Production data platform for event-driven lakehouse analytics and grounded RAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SDAIA Academy Capstone Team" }]
dependencies = [
  "confluent-kafka==2.6.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "pyspark==3.5.3",
  "delta-spark==3.3.0",
  "apache-airflow==2.10.5",
  "openlineage-python==1.27.0",
  "opensearch-py==2.8.0",
  "sentence-transformers==3.4.1",
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "tenacity==9.0.0",
  "great-expectations==1.3.7",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.3",
  "testcontainers[kafka]==4.9.1",
]

[project.scripts]
capstone = "capstone_de.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capstone_de"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"
markers = ["integration: requires the real Docker Compose platform services"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["capstone_de"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "great_expectations.*", "pyspark.*", "opensearchpy.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["capstone_de.rag.api"]
disallow_untyped_decorators = false
